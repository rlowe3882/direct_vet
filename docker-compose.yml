version: "3.9"

services:
  # --- 1. PostgreSQL Database Service ---
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-directvet}
      POSTGRES_USER: ${POSTGRES_USER:-directvet}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-directvet}
    volumes:
      # Persistent volume for PostgreSQL data
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      # Checks if the PostgreSQL server is running and ready to accept connections.
      test: ["CMD-SHELL", "pg_isready -U directvet -d directvet"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    # ports:
    #   - "5432:5432"

  # 🚀 NEW SERVICE: Database Migrations/Bootstrap
  # This service enforces schema creation and seeding before the backend API starts.
  migrations:
    build:
      context: ./backend # Use the same Dockerfile as the backend
    env_file:
      - backend/.env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://directvet:directvet@postgres:5432/directvet}
    depends_on:
      postgres:
        condition: service_healthy # Wait for the DB server to be healthy
    # This command directly calls the bootstrap function in your entrypoint and then exits.
    # It must run the full setup sequence (wait_for_database, create_schema, seed_reference_data).
    # NOTE: Assuming your docker-entrypoint.sh can be run with arguments,
    # or you have a standalone script to run the setup. For simplicity, we run the steps directly.
    command: >
      /bin/sh -c "
      ./docker-entrypoint.sh bootstrap_database # Assuming this runs only the setup part
      "
    # Set to 'no' so the service exits after success and doesn't try to run Uvicorn.
    restart: "no"
  
  # --- 2. FastAPI Backend Service ---
  backend:
    build:
      context: ./backend
    env_file:
      - backend/.env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://directvet:directvet@postgres:5432/directvet}
    volumes:
      - backend-documents:/app/files
    depends_on:
      # 🔑 CRITICAL FIX: Ensures the backend API only starts AFTER the schema is created and seeded.
      migrations:
        condition: service_completed_successfully
    ports:
      - "8000:8000"
    restart: unless-stopped
    # IMPORTANT: You must now remove the `bootstrap_database` call from the main 
    # execution path of your `docker-entrypoint.sh` in the backend service, 
    # otherwise it will try to run twice.

  # --- 3. React Frontend Service (Served by NGINX/Web Server inside container) ---
  frontend:
    build:
      context: ./frontend
    # The frontend is now dependent on the backend (API) which is dependent on migrations.
    depends_on:
      - backend
    # Maps local port 3000 to the container's web server port 80
    ports:
      - "3000:80"
    restart: unless-stopped

# --- 4. Volumes ---
volumes:
  backend-documents:
  postgres-data:
