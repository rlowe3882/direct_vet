version: "3.9"

services:
  backend:
    build:
      context: ./backend
    env_file:
      - backend/.env
    environment:
      DATABASE_URL: ${DATABASE_URL:-sqlite:////data/dev.db}
    volumes:
      - backend-documents:/app/files
      - backend-sqlite:/data
    ports:
      - "8000:8000"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    depends_on:
      - backend
    ports:
      - "3000:80"
    restart: unless-stopped

volumes:
  backend-documents:
  backend-sqlite:
